plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	accessWidenerPath = file('src/main/resources/matriochka.classtweaker')
	splitEnvironmentSourceSets()
	runs {
		client {
			programArgs '--quickPlaySingleplayer', 'matrio_test'
			vmArgs '-Xmx3G'
		}
		configureEach {
			if (name == 'clientGameTest' && project.hasProperty('trailer')) {
				vmArgs '-Dmatriochka.capture=trailer', '-Xmx6G', '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: ''), '-Dmatriochka.takes=' + (project.findProperty('takes') ?: 'adbfcg')
			}
			if (name == 'clientGameTest' && project.hasProperty('structures')) {
				vmArgs '-Dmatriochka.capture=structures', '-Xmx4G', '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('gui')) {
				vmArgs '-Dmatriochka.capture=gui'
			}
			if (name == 'clientGameTest' && project.hasProperty('fixes')) {
				vmArgs '-Dmatriochka.capture=fixes'
			}
			if (name == 'clientGameTest' && project.hasProperty('story')) {
				vmArgs '-Dmatriochka.capture=story'
			}
			if (name == 'clientGameTest' && project.hasProperty('moves')) {
				vmArgs '-Dmatriochka.capture=moves', '-Dmatriochka.debugMoves=true'
			}
		}
	}
	mods {
		matriochka {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "matriochka-showcase"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
