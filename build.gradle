plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// The Minecraft version to build for: -Pmc=26.2, 26.3 by default. Its dependencies come from
// versions/<mc>/gradle.properties, the calls that differ from versions/<mc>/{main,client}/java and the data that
// differs (world generation, made by tools/gen.py --mc) from versions/<mc>/main/resources, laid over src/main/resources.
def mc = (project.findProperty('mc') ?: '26.3').toString()
def versionProps = new Properties()
file("versions/${mc}/gradle.properties").withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k.toString(), v.toString()) }
project.ext.set('mc', mc)
// the default version builds into build/, the others into build/mc-<mc>/ so switching does not rebuild everything
if (mc != '26.3') layout.buildDirectory = file("build/mc-${mc}")

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
	// Just Enough Items: optional, only compiled against (the plugin loads only when JEI is installed)
	exclusiveContent {
		forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' } }
		filter { includeGroup 'mezz.jei' }
	}
	// Roughly Enough Items: optional, only compiled against (the plugin loads only when REI is installed)
	exclusiveContent {
		forRepository { maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me' } }
		filter { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth'; includeGroup 'dev.architectury' }
	}
}

loom {
	accessWidenerPath = file('src/main/resources/matriochka.classtweaker')
	splitEnvironmentSourceSets()
	runs {
		client {
			programArgs '--quickPlaySingleplayer', 'matrio_test'
			vmArgs '-Xmx3G'
		}
		// a dedicated server of its own (tools/server_smoke.sh): no client class may load there
		server {
			runDir 'run/server'
			programArgs 'nogui'
			vmArgs '-Xmx2G'
		}
		configureEach {
			// no sound reaches the speakers during runs and captures: OpenAL Soft plays to its null output, the game's
			// sound logic (music state, cues) still runs. -Psound for a capture that needs real audio.
			if (!project.hasProperty('sound')) environmentVariable 'ALSOFT_DRIVERS', 'null'
			if (name == 'clientGameTest' && project.hasProperty('trailer')) {
				vmArgs '-Dmatriochka.capture=trailer', '-Xmx6G', '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: ''), '-Dmatriochka.takes=' + (project.findProperty('takes') ?: 'adbfcg')
			}
			if (name == 'clientGameTest' && project.hasProperty('structures')) {
				vmArgs '-Dmatriochka.capture=structures', '-Xmx4G', '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: ''), '-Dmatriochka.role=' + (project.findProperty('role') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('gui')) {
				vmArgs '-Dmatriochka.capture=gui'
			}
			if (name == 'clientGameTest' && project.hasProperty('epic')) {
				vmArgs '-Dmatriochka.capture=epic', '-Xmx6G', '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: ''), '-Dmatriochka.takes=' + (project.findProperty('takes') ?: 'atkor')
			}
			if (name == 'clientGameTest' && project.hasProperty('automation')) {
				vmArgs '-Dmatriochka.capture=automation'
			}
			if (name == 'clientGameTest' && project.hasProperty('fixes')) {
				vmArgs '-Dmatriochka.capture=fixes'
			}
			if (name == 'clientGameTest' && project.hasProperty('rules')) {
				vmArgs '-Dmatriochka.capture=rules'
			}
			if (name == 'clientGameTest' && project.hasProperty('ocean')) {
				vmArgs '-Dmatriochka.capture=ocean'
			}
			if (name == 'clientGameTest' && project.hasProperty('story')) {
				vmArgs '-Dmatriochka.capture=story'
			}
			if (name == 'clientGameTest' && project.hasProperty('systems')) {
				vmArgs '-Dmatriochka.capture=systems'
			}
			if (name == 'clientGameTest' && project.hasProperty('scale')) {
				vmArgs '-Dmatriochka.capture=scale'
			}
			if (name == 'clientGameTest' && project.hasProperty('visuals')) {
				vmArgs '-Dmatriochka.capture=visuals', '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('hud')) {
				vmArgs '-Dmatriochka.capture=hud'
			}
			if (name == 'clientGameTest' && project.hasProperty('comfort')) {
				vmArgs '-Dmatriochka.capture=comfort'
			}
			if (name == 'clientGameTest' && project.hasProperty('playthrough')) {
				vmArgs '-Dmatriochka.capture=playthrough', '-Xmx4G'
			}
			if (name == 'clientGameTest' && project.hasProperty('onboarding')) {
				vmArgs '-Dmatriochka.capture=onboarding'
			}
			if (name == 'clientGameTest' && project.hasProperty('replay')) {
				vmArgs '-Dmatriochka.capture=replay'
			}
			if (name == 'clientGameTest' && project.hasProperty('replayshots')) {
				vmArgs '-Dmatriochka.capture=replayshots', '-Xmx4G', '-Dmatriochka.takes=' + (project.findProperty('takes') ?: ''), '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('screens')) {
				vmArgs '-Dmatriochka.capture=screens'
			}
			if (name == 'clientGameTest' && project.hasProperty('awaken')) {
				vmArgs '-Dmatriochka.capture=awaken', '-Dmatriochka.bosses=' + (project.findProperty('bosses') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('polish')) {
				vmArgs '-Dmatriochka.capture=polish'
			}
			if (name == 'clientGameTest' && project.hasProperty('transition')) {
				vmArgs '-Dmatriochka.capture=transition'
			}
			if (name == 'clientGameTest' && project.hasProperty('rites')) {
				vmArgs '-Dmatriochka.capture=rites'
			}
			if (name == 'clientGameTest' && project.hasProperty('machines')) {
				vmArgs '-Dmatriochka.capture=machines', '-Dmatriochka.only=' + (project.findProperty('only') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('tiktok')) {
				vmArgs '-Dmatriochka.capture=tiktok', '-Xmx5G', '-Dmatriochka.takes=' + (project.findProperty('takes') ?: ''), '-Dmatriochka.worlds=' + (project.findProperty('worlds') ?: ''), '-Dmatriochka.full=' + (project.findProperty('full') ?: '')
			}
			if (name == 'clientGameTest' && project.hasProperty('moves')) {
				vmArgs '-Dmatriochka.capture=moves', '-Dmatriochka.debugMoves=true', '-Dmatriochka.bosses=' + (project.findProperty('bosses') ?: '')
			}
		}
	}
	mods {
		matriochka {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "matriochka-showcase"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
	clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	// ./gradlew runClient -Pjei to try the recipe pages in a dev client
	if (project.hasProperty('jei')) localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	// REI and Jade: optional, only compiled against (their entrypoints load only when they are installed)
	clientCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
	clientCompileOnly("me.shedaniel.cloth:basic-math:0.6.1") { transitive = false }
	clientCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
	clientCompileOnly("maven.modrinth:jade:${project.jade_version}") { transitive = false }
	// ./gradlew runClient -Prei / -Pjade to try them in a dev client
	if (project.hasProperty('rei')) localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	if (project.hasProperty('jade')) localRuntime("maven.modrinth:jade:${project.jade_version}") { transitive = false }
	// Mod Menu: optional, only compiled against (its entrypoint loads only when Mod Menu is installed)
	clientCompileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }
	// ./gradlew runClient -Pcompat to try the mod with Sodium, Iris and Mod Menu in a dev client (see docs-wiki-drafts/Compatibility.md)
	if (project.hasProperty('compat')) {
		localRuntime("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }
		localRuntime("maven.modrinth:placeholder-api:${project.placeholder_api_version}") { transitive = false }
		localRuntime("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
		localRuntime("maven.modrinth:iris:${project.iris_version}") { transitive = false }
	}
}

sourceSets {
	main {
		java.srcDir "versions/${mc}/main/java"
		resources.srcDirs = ["versions/${mc}/main/resources", 'src/main/resources']
	}
	client { java.srcDir "versions/${mc}/client/java" }
	gametest { java.srcDir "versions/${mc}/gametest/java" }
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_dep', project.minecraft_dep
	// a file of versions/<mc>/main/resources replaces the one of the same path in src/main/resources
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	filesMatching('fabric.mod.json') { expand 'version': project.version, 'minecraft_dep': project.minecraft_dep }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }

// the sources jar holds both resource trees too: the version's file wins, as in the mod jar
tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
