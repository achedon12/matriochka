name: Idea or suggestion
description: A new mechanic, mob, item, or a change to an existing one.
labels: [suggestion]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should exist or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or what moment of play does it improve?
    validations:
      required: true
  - type: input
    id: world
    attributes:
      label: World concerned
      placeholder: World 5, The Dark
