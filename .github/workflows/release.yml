name: release

# Every push to main publishes the version declared in gradle.properties (mod_version),
# unless a tag for it already exists:
#   1. build the jar
#   2. create the tag and the GitHub release, with the notes from CHANGELOG.md ("## <version>" section), the jar
#      and the optional Matriochka HD resource pack (tools/hdpack.py)
#   3. upload the jar to CurseForge (needs the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable)
#   4. upload the jar to Modrinth (needs the MODRINTH_TOKEN secret and the MODRINTH_PROJECT_ID variable)
#   5. build the Matriochka Pack with tools/modpack.py (Modrinth .mrpack and CurseForge .zip, normal and hard),
#      attach it to the GitHub release and upload it to the pack's own projects with tools/modpack_publish.sh
#      (needs the MODRINTH_PACK_PROJECT_ID / CURSEFORGE_PACK_PROJECT_ID variables; skipped without them)
#   6. announce it in the Discord changelog channel (needs the DISCORD_RELEASES_WEBHOOK secret)
# Run it by hand from the Actions tab to upload an existing version again. The pack alone, for an existing tag:
# the modpack workflow (modpack.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Tag v$version already exists: nothing to publish. Bump mod_version to release."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 || index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo "**Requires:** Minecraft ${{ steps.v.outputs.mc }}, Fabric Loader, Fabric API and GeckoLib. Install on the client to play solo, on both server and clients to play together."
            echo
            cat notes.md
          } > release-notes.md

      - name: Use the tagged sources when re-uploading an existing version
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.publish == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: git checkout --quiet "$TAG"

      - uses: actions/setup-java@v6
        if: steps.v.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        if: steps.v.outputs.publish == 'true'
        run: |
          ./gradlew build --no-daemon
          echo "JAR=$(ls build/libs/matriochka-*.jar | grep -v sources | head -1)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        if: steps.v.outputs.exists == 'false'
        with:
          python-version: "3.12"

      # the optional Matriochka HD resource pack (32 x 32 textures), painted by tools/hdpack.py
      - name: HD resource pack
        if: steps.v.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python -m pip install --quiet pillow
          python tools/hdpack.py "build/matriochka-hd-$VERSION.zip"
          echo "HD=build/matriochka-hd-$VERSION.zip" >> "$GITHUB_ENV"

      - name: GitHub release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "$TAG" "$JAR" "$HD" --title "Matriochka $VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"

      - name: CurseForge
        id: cf
        if: steps.v.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MC: ${{ steps.v.outputs.mc }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "::warning::CurseForge is not configured (CURSEFORGE_TOKEN secret / CURSEFORGE_PROJECT_ID variable), skipping"
            exit 0
          fi
          api=https://minecraft.curseforge.com/api
          curl -fsS -H "X-Api-Token: $TOKEN" "$api/game/version-types" -o cf-types.json
          curl -fsS -H "X-Api-Token: $TOKEN" "$api/game/versions" -o cf-versions.json
          mcslug="minecraft-$(echo "$MC" | cut -d. -f1-2 | tr . -)"
          ids=$(jq -nc --slurpfile t cf-types.json --slurpfile v cf-versions.json --arg mc "$MC" --arg mcslug "$mcslug" '
            def tid(s): [$t[0][] | select(.slug == s) | .id][0];
            [ $v[0][] | select(
                (.gameVersionTypeID == tid($mcslug) and .name == $mc) or
                (.gameVersionTypeID == tid("modloader") and .name == "Fabric") or
                (.gameVersionTypeID == tid("environment") and (.name == "Client" or .name == "Server")) or
                (.gameVersionTypeID == tid("java") and .name == "Java 25")
              ) | .id ] | unique')
          echo "CurseForge game version ids: $ids"
          metadata=$(jq -n \
            --arg changelog "$(cat release-notes.md)" \
            --arg name "Matriochka $VERSION" \
            --argjson versions "$ids" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, releaseType: "alpha", gameVersions: $versions,
              relations: {projects: [{slug: "fabric-api", type: "requiredDependency"}, {slug: "geckolib", type: "requiredDependency"}]}}')
          curl -sS --fail-with-body -H "X-Api-Token: $TOKEN" \
            --form-string "metadata=$metadata" \
            -F "file=@$JAR" \
            "$api/projects/$PROJECT/upload-file" -o cf-upload.json
          cat cf-upload.json
          # the CurseForge pack points at this file
          echo "file_id=$(jq -r .id cf-upload.json)" >> "$GITHUB_OUTPUT"

      - name: Modrinth
        if: steps.v.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
          MC: ${{ steps.v.outputs.mc }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "::warning::Modrinth is not configured (MODRINTH_TOKEN secret / MODRINTH_PROJECT_ID variable), skipping"
            exit 0
          fi
          data=$(jq -n \
            --arg project "$PROJECT" --arg name "Matriochka $VERSION" --arg number "$VERSION" --arg mc "$MC" \
            --arg changelog "$(cat release-notes.md)" \
            '{project_id: $project, name: $name, version_number: $number, changelog: $changelog,
              game_versions: [$mc], loaders: ["fabric"], version_type: "alpha", featured: true,
              dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}, {project_id: "8BmcQJ2H", dependency_type: "required"}],
              file_parts: ["file"], primary_file: "file"}')
          curl -sS --fail-with-body -H "Authorization: $TOKEN" -H "User-Agent: achedon12/matriochka release workflow" \
            --form-string "data=$data" -F "file=@$JAR" \
            https://api.modrinth.com/v2/version

      # The Modrinth pack points at the jar of the GitHub release (or at Modrinth's copy once it is public), the
      # CurseForge pack at the CurseForge file uploaded above. None of these steps can fail the release.
      - name: Modpack
        id: pack
        if: steps.v.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          python3 tools/modpack.py --jar "$JAR" --out build/modpack
          python3 tools/modpack.py --jar "$JAR" --out build/modpack --hard
          gh release upload "$TAG" build/modpack/*.mrpack --clobber

      - name: Modpack on Modrinth
        if: steps.v.outputs.publish == 'true' && steps.pack.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PACK_PROJECT_ID }}
          MC: ${{ steps.v.outputs.mc }}
          VERSION: ${{ steps.v.outputs.version }}
        run: tools/modpack_publish.sh modrinth

      - name: CurseForge modpack
        id: cfpack
        # only once the CurseForge pack project exists (it needs the CURSEFORGE_API_KEY secret)
        if: steps.v.outputs.publish == 'true' && vars.CURSEFORGE_PACK_PROJECT_ID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CF_FILE: ${{ steps.cf.outputs.file_id }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          file=()
          if [ -n "$CF_FILE" ] && [ "$CF_FILE" != null ]; then file=(--cf-mod-file "$CF_FILE"); fi
          python3 tools/modpack.py --jar "$JAR" --out build/modpack --curseforge "${file[@]}"
          python3 tools/modpack.py --jar "$JAR" --out build/modpack --curseforge --hard "${file[@]}"
          gh release upload "$TAG" build/modpack/*-curseforge.zip --clobber

      - name: Modpack on CurseForge
        if: steps.v.outputs.publish == 'true' && steps.cfpack.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT: ${{ vars.CURSEFORGE_PACK_PROJECT_ID }}
          MC: ${{ steps.v.outputs.mc }}
          VERSION: ${{ steps.v.outputs.version }}
        run: tools/modpack_publish.sh curseforge

      - name: Discord
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh workflow run discord-release.yml -f tag="$TAG"
