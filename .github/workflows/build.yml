name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generated files are up to date
        run: |
          python3 tools/gen.py
          python3 tools/versions.py
          git diff --stat --exit-code -- src versions || (echo "Run python3 tools/gen.py and python3 tools/versions.py and commit the result." && exit 1)
      - name: Every reference in the data resolves, for every Minecraft version
        run: python3 tools/check_refs.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # one jar per Minecraft version (versions/<mc>/): 26.3 into build/libs, the others into build/mc-<mc>/libs
      - run: for mc in $(ls versions); do ./gradlew build -Pmc=$mc || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: matriochka-jar
          path: |
            build/libs/*.jar
            build/mc-*/libs/*.jar

  # the game itself, for every Minecraft version: a dedicated server that generates every world, then the client
  # tests (the first steps and the whole game, World 0 to the end) in a virtual screen with software rendering
  play:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # 26.3 asks for its own GLX visual and falls back to Vulkan: the software Vulkan (lavapipe) is there for it
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Graphics available
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" sh -c 'glxinfo -B; glxinfo | grep -c "0x[0-9a-f]* 24 tc"' || true
          vulkaninfo --summary 2>&1 | head -30 || true
      - name: Dedicated server
        run: tools/server_smoke.sh ${{ matrix.mc }}
      - name: First steps
        timeout-minutes: 25
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew runClientGameTest -Pmc=${{ matrix.mc }} -Ponboarding
      - name: The whole game
        if: github.event_name == 'push'
        timeout-minutes: 60
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew runClientGameTest -Pmc=${{ matrix.mc }} -Pplaythrough
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.mc }}
          path: |
            run/server/logs/
            build/**/run/clientGameTest/logs/
            run/clientGameTest/logs/
