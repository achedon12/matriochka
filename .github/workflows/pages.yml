name: Website

on:
  push:
    branches: [main]
    # a release tag adds its version to the site (tools/site_versions.py); paths are not checked for tags
    tags: ["v*"]
    paths: ["site/**", "tools/**", "src/main/resources/**", "src/main/java/**/Recipes.java", "branding/**", "CHANGELOG.md", "gradle.properties", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # a tag push builds the site from the default branch, which now knows that tag
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.event.repository.default_branch || github.ref }}
          # every release tag, for the data of each version
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # prebuild runs tools/site.py (data + assets) and tools/site_versions.py (each release tag's data), then
      # next build writes the static site to site/out (the older versions are drawn by one reader page, /v/)
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
